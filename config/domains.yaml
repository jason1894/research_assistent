# Research Domain Configuration

machine_learning:
  display_name: "Machine Learning"
  description: "Core machine learning algorithms, theory, and applications"
  key_topics:
    - "neural networks"
    - "deep learning"
    - "transfer learning"
    - "reinforcement learning"
    - "supervised learning"
    - "unsupervised learning"
    - "semi-supervised learning"
    - "self-supervised learning"
    - "meta-learning"
    - "few-shot learning"
    - "generative models"
    - "attention mechanisms"
    - "transformers"
    - "convolutional neural networks"
    - "recurrent neural networks"
    - "graph neural networks"
    - "contrastive learning"
    - "federated learning"
  relevant_conferences:
    - "NeurIPS"
    - "ICML"
    - "ICLR"
    - "CVPR"
    - "ECCV"
    - "ACL"
    - "EMNLP"
  keywords_for_retrieval:
    - "model"
    - "training"
    - "loss"
    - "accuracy"
    - "benchmark"
    - "dataset"

statistics:
  display_name: "Statistics & Probability"
  description: "Statistical methods, probability theory, and data analysis"
  key_topics:
    - "Bayesian inference"
    - "hypothesis testing"
    - "regression analysis"
    - "time series analysis"
    - "causal inference"
    - "Monte Carlo methods"
    - "MCMC"
    - "variational inference"
    - "maximum likelihood estimation"
    - "Gaussian processes"
    - "survival analysis"
    - "experimental design"
    - "multiple testing"
    - "bootstrap methods"
    - "nonparametric statistics"
  relevant_conferences:
    - "AISTATS"
    - "UAI"
    - "ICSA"
  keywords_for_retrieval:
    - "distribution"
    - "probability"
    - "estimator"
    - "variance"
    - "significance"
    - "posterior"
    - "likelihood"

mathematics:
  display_name: "Mathematics"
  description: "Pure and applied mathematics relevant to ML/AI research"
  key_topics:
    - "linear algebra"
    - "optimization"
    - "probability theory"
    - "information theory"
    - "topology"
    - "differential equations"
    - "functional analysis"
    - "matrix theory"
    - "convex analysis"
    - "stochastic processes"
    - "numerical methods"
    - "combinatorics"
    - "graph theory"
    - "measure theory"
  keywords_for_retrieval:
    - "theorem"
    - "proof"
    - "lemma"
    - "convergence"
    - "bound"
    - "approximation"
    - "algorithm"

transfer_learning:
  display_name: "Transfer Learning"
  description: "Methods for transferring knowledge across domains and tasks"
  is_special_domain: true
  focus_areas:
    - "domain adaptation"
    - "fine-tuning strategies"
    - "pre-training objectives"
    - "knowledge distillation"
    - "multi-task learning"
    - "zero-shot learning"
    - "prompt tuning"
    - "adapter methods"
    - "LoRA and parameter-efficient fine-tuning"
    - "instruction tuning"
    - "RLHF"
    - "chain-of-thought prompting"
  base_models:
    - "BERT"
    - "GPT"
    - "T5"
    - "LLaMA"
    - "Mistral"
    - "Qwen"
  keywords_for_retrieval:
    - "pre-trained"
    - "fine-tune"
    - "adapter"
    - "zero-shot"
    - "few-shot"
    - "domain"
    - "transfer"
